name: Generate README assets

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "README.md"
      - ".github/workflows/generate-readme-assets.yml"

permissions:
  contents: write

jobs:
  generate:
    name: Generate README assets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate stats card
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&show_icons=true&theme=dracula&hide_border=true&include_all_commits=true&count_private=true"
          path: dist/stats.svg
          token: ${{ secrets.GH_STATS_TOKEN }}

      - name: Generate top languages card
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: top-langs
          options: "username=${{ github.repository_owner }}&layout=compact&theme=dracula&hide_border=true&langs_count=10&size_weight=0.5&count_weight=0.5&hide=html,css,jupyter%20notebook"
          path: dist/top-langs.svg
          token: ${{ secrets.GH_STATS_TOKEN }}

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      - name: Push assets to readme-assets branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: readme-assets
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
